<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>GPS</title>

    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GPS" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#4567fa" />

    <!-- Web App Manifest & App Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/logo/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="./assets/logo/gps_logo_2000x2000_white_over_black.svg" />
    <link rel="apple-touch-icon" href="./assets/logo/icon-512.png" />
    <link rel="manifest" href="manifest.json" />

    <link rel="stylesheet" href="style.css" />

    <!-- Google Identity Services (GIS) Library -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <!-- 1. App Startup Splash Loading Screen -->
    <div id="app-splash-screen" class="app-splash-screen" aria-label="Loading Application">
      <div class="splash-content">
        <div class="splash-logo-wrapper">
          <div class="splash-spinner-ring"></div>
          <img src="./assets/logo/gps_logo_2000x2000_white_over_black.svg?v=50" alt="GPS Logo" class="splash-logo" />
        </div>
        <div class="splash-title">Gulf Pioneer Star</div>
        <div class="splash-subtitle" id="splash-status-text">Verifying Session & Loading Data...</div>
      </div>
    </div>

    <!-- 2. Full-Screen Logged Out Protection Screen -->
    <div id="logged-out-screen" class="logged-out-screen is-hidden" aria-label="Authentication Required">
      <div class="auth-card">
        <div class="auth-header">
          <div class="auth-logo-badge">
            <img src="./assets/logo/gps_logo_2000x2000_white_over_black.svg?v=50" alt="GPS Logo" />
          </div>
          <h2 class="auth-title">Gulf Pioneer Star</h2>
          <p class="auth-subtitle">Sales & Inventory Management System</p>
        </div>

        <form id="logged-out-login-form" class="auth-form" autocomplete="off">
          <div class="auth-error-banner" id="auth-error-banner" hidden></div>

          <!-- Primary Sign-In Method -->
          <button type="button" id="btn-auth-google" class="auth-google-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
              <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.29v3.15C3.26 21.3 7.37 24 12 24z"/>
              <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.29C.47 8.21 0 10.05 0 12s.47 3.79 1.29 5.42l3.99-3.15z"/>
              <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.37 0 3.26 2.7 1.29 6.58l3.99 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
            </svg>
            <span>Sign in with Google</span>
          </button>

          <!-- Emergency Access Toggle Button -->
          <button type="button" id="btn-toggle-emergency" class="auth-emergency-toggle-btn">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            <span>Emergency Access</span>
            <svg class="chevron-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>

          <!-- Dropdown Emergency Access Panel -->
          <div id="emergency-access-panel" class="emergency-access-panel" hidden>
            <div class="auth-field-group">
              <label for="auth-emergency-code-input" class="auth-field-label">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                Emergency Backup Code
              </label>
              <input type="password" id="auth-emergency-code-input" class="auth-input" placeholder="Enter Emergency Backup Code" autocomplete="off" />
            </div>

            <button type="submit" id="btn-auth-emergency-submit" class="auth-submit-btn auth-emergency-submit-btn">
              <span class="btn-text">Verify & Sign In</span>
              <div class="btn-spinner" id="auth-btn-spinner" hidden></div>
            </button>
          </div>
        </form>
      </div>
    </div>

    <div class="bg">
      <div class="glass-blur">
        <div class="top-panel" aria-label="Header">
          <div class="logo-placeholder" aria-hidden="true">
            <!-- Logo -->
            <img src="./assets/logo/gps_logo_2000x2000_color_over_white.svg?v=43" alt="GPS Logo" />
          </div>

          <button class="profile-button" type="button" aria-label="Profile" id="btn-top-profile">
            <div class="top-profile-badge" id="top-profile-badge">AK</div>
          </button>
        </div>

        <div class="form-panel" aria-label="Page content panel">
          <div class="panel-page" data-page="1" hidden>
            <div id="view-sales-root">
              <!-- View Sales history will be rendered here -->
            </div>
          </div>

          <div class="panel-page" data-page="2" hidden>
            <div id="view-inventory-root">
              <!-- View Stock Inventory will be rendered here -->
            </div>
          </div>

          <div class="panel-page panel-page--active" data-page="3">
            <div id="add-sales-root">
              <!-- Add Sales form will be rendered here -->
            </div>
          </div>

          <div class="panel-page" data-page="4" hidden>
            <div id="add-stock-root">
              <!-- Add Stock form will be rendered here -->
            </div>
          </div>

          <div class="panel-page" data-page="5" hidden>
            <div id="amend-stock-root">
              <!-- Amend Stock form will be rendered here -->
            </div>
          </div>

          <div class="panel-page" data-page="profile" hidden>
            <div id="profile-page-root">
              <!-- Profile & Branch Access UI will be rendered here -->
            </div>
          </div>
        </div>

        <nav class="nav-panel" aria-label="Primary navigation">
          <button class="nav-button" type="button">
            <!-- Placeholder: replace number with navigation icon for page 1 -->
            <img src="./assets/icons/view_cart.svg" alt="View Sales" />
            <span class="nav-label">Sales</span>
          </button>

          <button class="nav-button" type="button">
            <!-- Placeholder: replace number with navigation icon for page 2 -->
            <img src="./assets/icons/view_inventory.svg" alt="View Inventory" />
            <span class="nav-label">Inventory</span>
          </button>

          <button class="nav-button" type="button">
            <!-- Placeholder: replace number with center/main action icon -->
            <img src="./assets/icons/add_cart.svg" alt="Add Sale" />
            <span class="nav-label">Add Sale</span>
          </button>

          <button class="nav-button" type="button">
            <!-- Placeholder: replace number with navigation icon for page 4 -->
            <img src="./assets/icons/add_inventory.svg" alt="Add Stock" />
            <span class="nav-label">Add Stock</span>
          </button>

          <button class="nav-button" type="button">
            <!-- Placeholder: replace number with navigation icon for page 5 -->
            <img src="./assets/icons/amend_inventory.svg" alt="Amend Stock" />
            <span class="nav-label">Amend Stock</span>
          </button>
        </nav>
      </div>
    </div>

    <script src="config.js"></script>
    <script src="js/developer.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/data-store.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/components/date-picker.js"></script>
    <script src="js/components/filter-pills.js"></script>
    <script src="js/components/search-box.js"></script>
    <script src="js/components/sync-button.js"></script>
    <script src="js/components/compact-tile.js"></script>
    <script src="js/components/detail-view.js"></script>
    <script src="js/components/stat-card.js"></script>
    <script src="js/components/item-suggestions.js"></script>
    <script src="js/pages/view-sales.js"></script>
    <script src="js/pages/view-inventory.js"></script>
    <script src="js/pages/profile.js"></script>
    <script src="js/pages/add-sales.js"></script>
    <script src="js/pages/add-stock.js"></script>
    <script src="js/pages/amend-stock.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
